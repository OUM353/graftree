text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #9198a1; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
.head { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
.ink { fill: #f0f6fc; }
.bold { font-weight: 600; fill: #f0f6fc; }
.lg { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 600; fill: #ffffff; }
</style>
