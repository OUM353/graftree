<svg xmlns="http://www.w3.org/2000/svg" width="880" height="504" viewBox="0 0 880 504" role="img" aria-labelledby="title desc">
<title id="title">How graftree works</title>
<desc id="desc">A problem becomes a plan: a tree of sub-tasks with acceptance tests. You approve it, which locks the tests. Each leaf is solved several times, by different models, each in its own git worktree; attempts must pass the gates, and the closer picks the best. Winners are integrated and reviewed up the tree, and the closer makes the final call: one branch and a report.</desc>
