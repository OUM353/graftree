name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: schema files and committed dist/ are up to date
        if: runner.os == 'Linux'
        run: npm run schema && git diff --exit-code schema/ dist/
      - name: installs globally from the packed tarball and runs
        if: runner.os != 'Windows'
        run: npm pack && npm i -g ./graftree-agent-*.tgz && graftree --version
